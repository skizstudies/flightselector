<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight 2026 - Turbulence Event</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Assets -->
    <audio id="bgm" src="flight-ambience.mp3" loop></audio>
    <audio id="sfx-turbulence" src="airplane-turbulence.mp3"></audio>
    <audio id="sfx-correct" src="chime-correct.mp3"></audio>
    <audio id="sfx-wrong" src="buzzer-wrong.mp3"></audio>

    <div id="pre-flight">
        <button id="start-flight-btn" class="success-btn">BOARD FLIGHT (Enable Audio)</button>
    </div>

    <div id="flight-dashboard" class="dashboard hidden">
        <header>
            <h1>Flight 10426 → IDN</h1>
            <div class="status-bar">
                <span id="lives-display">Lives: ❤️❤️❤️</span>
                <span id="questions-display">Questions Left: 6</span>
            </div>
        </header>

        <!-- Airplane Cabin Layout -->
        <div class="airplane-body">
            <div class="cockpit-door">COCKPIT</div>
            <div id="cabin-rows" class="cabin">
                <!-- Seats here via JS -->
            </div>
        </div>

        <div class="controls">
            <button id="turbulence-btn" class="danger-btn">WARNING: INITIATE TURBULENCE</button>
        </div>
    </div>

    <!-- Emergency Selection Overlay -->
    <div id="emergency-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="flashing-text">EMERGENCY PROTOCOL ACTIVATED</h2>
            <p>Passenger called to save the flight:</p>
            <h1 id="selected-passenger">SYSTEM SELECTING...</h1>
            <div class="modal-actions">
                <button id="correct-btn" class="success-btn">Correct Answer (Saved!)</button>
                <button id="wrong-btn" class="danger-btn">Incorrect Answer (-1 Life)</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
