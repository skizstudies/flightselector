<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight 2026 - Turbulence Event</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Assets -->
    <audio id="bgm" src="flight-ambience.mp3" loop></audio>
    <audio id="sfx-turbulence" src="airplane-turbulence.mp3"></audio>
    <audio id="sfx-correct" src="chime-correct.mp3"></audio>
    <audio id="sfx-wrong" src="buzzer-wrong.mp3"></audio>

    <div id="red-flash-overlay"></div>

    <div id="pre-flight">
        <button id="start-flight-btn" class="success-btn">Board Flight 10426 to Indonesia!</button>
    </div>

    <!-- Main Game UI -->
    <div id="main-game" class="game-layout hidden">
        
        <!-- Left Column: Airplane Dashboard -->
        <div id="flight-dashboard" class="dashboard">
            <header>
                <h1>Flight 10426 → IDN</h1>
                <div class="status-bar">
                    <span id="lives-display">❤️❤️❤️</span>
                    <span id="questions-display">Questions Left: 6</span>
                </div>
            </header>

            <div class="airplane-body">
                <div class="cockpit-door">COCKPIT</div>
                <div id="cabin-rows" class="cabin">
                    <!-- Seats here via JS -->
                </div>
            </div>

            <div class="controls">
                <button id="turbulence-btn" class="danger-btn">WARNING: INITIATE TURBULENCE</button>
            </div>
        </div>

        <!-- Right Column: Action & Question Panel -->
        <div id="action-panel" class="side-panel">
            
            <!-- Idle / Safe State -->
            <div id="status-idle" class="panel-content">
                <h2 style="color: var(--sand);">FLIGHT STATUS</h2>
                <h1 style="color: var(--sky); font-size: 2.5rem; margin: 10px 0;">NORMAL</h1>
                <p>Cruising altitude reached.<br>Awaiting turbulence events...</p>
            </div>

            <!-- Emergency / Question State -->
            <div id="status-emergency" class="panel-content hidden">
                <h2 class="flashing-text">EMERGENCY PROTOCOL</h2>
                <p>Passenger called to save the flight:</p>
                
                <h1 id="selected-passenger">SYSTEM SELECTING...</h1>
                
                <div class="modal-actions">
                    <div class="main-buttons">
                        <button id="correct-btn" class="success-btn">Correct (Saved!)</button>
                        <button id="wrong-btn" class="danger-btn">Incorrect (-1)</button>
                    </div>
                    
                    <button id="void-btn" class="void-btn">Void</button>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
